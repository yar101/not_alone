worker_processes auto;
pid /tmp/no-alone-nginx.pid;
error_log /tmp/no-alone-nginx-error.log;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path /tmp/no-alone-nginx-client;
    proxy_temp_path       /tmp/no-alone-nginx-proxy;
    fastcgi_temp_path     /tmp/no-alone-nginx-fastcgi;
    uwsgi_temp_path       /tmp/no-alone-nginx-uwsgi;
    scgi_temp_path        /tmp/no-alone-nginx-scgi;

    client_max_body_size 100M;

    server {
        listen 8443 ssl;
        server_name 192.168.1.62 localhost;

        ssl_certificate     /home/yar101/projects/laravel/no_alone/192.168.1.62.pem;
        ssl_certificate_key /home/yar101/projects/laravel/no_alone/192.168.1.62-key.pem;

        root  /home/yar101/projects/laravel/no_alone/public;
        index index.php;

        # X-Accel-Redirect: только внутренний доступ
        location /private-media/ {
            internal;
            alias /home/yar101/projects/laravel/no_alone/storage/app/private/;
        }

        # Service Worker header
        location = /build/sw.js {
            add_header Service-Worker-Allowed /;
            try_files $uri =404;
        }

        # WebSocket → Reverb
        location ~ ^/app/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location ~ ^/apps/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Статика
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass unix:/tmp/no-alone-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 8443;
        }
    }
}
