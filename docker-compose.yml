services:
  db:
    image: postgres:16-alpine
    container_name: no_alone_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: noalone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noalone"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: no_alone_redis
    ports:
      - "6379:6379"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: no_alone_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: no_alone_app:dev
    container_name: no_alone_app
    ports:
      - "8443:8443"
    environment:
      CONTAINER_ROLE: web
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: ru
      APP_URL: https://${DEV_HOST:-192.168.1.122}:8443
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: noalone
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-notalonekey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-notalonesecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-notalonekey}
      VITE_REVERB_HOST: ${DEV_HOST:-192.168.1.122}
      VITE_REVERB_PORT: 8443
      VITE_REVERB_SCHEME: https
      AWS_ACCESS_KEY_ID: sail
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: not-alone
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: https://${DEV_HOST:-192.168.1.122}:8443/not-alone
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
    volumes:
      - .:/var/www/html
      - ./docker/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./${DEV_HOST:-192.168.1.122}.pem:/etc/nginx/certs/dev.pem:ro
      - ./${DEV_HOST:-192.168.1.122}-key.pem:/etc/nginx/certs/dev-key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8443/up || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    image: no_alone_app:dev
    container_name: no_alone_worker
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: ru
      APP_URL: https://${DEV_HOST:-192.168.1.122}:8443
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: noalone
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-notalonekey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-notalonesecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AWS_ACCESS_KEY_ID: sail
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: not-alone
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: https://${DEV_HOST:-192.168.1.122}:8443/not-alone
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: no_alone_app:dev
    container_name: no_alone_scheduler
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: ru
      APP_URL: https://${DEV_HOST:-192.168.1.122}:8443
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: noalone
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-notalonekey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-notalonesecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      AWS_ACCESS_KEY_ID: sail
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: not-alone
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: https://${DEV_HOST:-192.168.1.122}:8443/not-alone
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    image: no_alone_app:dev
    container_name: no_alone_reverb
    ports:
      - "8080:8080"
    environment:
      CONTAINER_ROLE: reverb
      APP_ENV: local
      APP_DEBUG: "true"
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: ru
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: noalone
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-123456}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-notalonekey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-notalonesecret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: node:22-alpine
    container_name: no_alone_vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    environment:
      DEV_HOST: ${DEV_HOST:-192.168.1.122}
      VITE_REVERB_HOST: ${DEV_HOST:-192.168.1.122}
      VITE_REVERB_PORT: 8443
      VITE_REVERB_SCHEME: https
    volumes:
      - .:/var/www/html
    command: npm run dev
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: no_alone_minio
    ports:
      - "9000:9000"
      - "8900:8900"
    environment:
      MINIO_ROOT_USER: sail
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data/minio
    command: minio server /data/minio --console-address ":8900"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  minio-setup:
    image: minio/mc
    container_name: no_alone_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./public/cat_images:/cat_images:ro
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 sail password; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb myminio/not-alone || true;
      /usr/bin/mc anonymous set download myminio/not-alone;
      [ -d /cat_images ] && /usr/bin/mc cp -r /cat_images myminio/not-alone/ || true;
      exit 0;
      "

volumes:
  db_data:
  minio_data:

