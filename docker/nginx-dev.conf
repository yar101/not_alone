user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    types_hash_max_size 2048;

    resolver 127.0.0.11 valid=30s ipv6=off;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    client_max_body_size 100M;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev.pem;
        ssl_certificate_key /etc/nginx/certs/dev-key.pem;

        root  /var/www/html/public;
        index index.php;

        # Private files access control via X-Accel-Redirect
        location /private-media/ {
            internal;
            alias /var/www/html/storage/app/private/;
        }

        # Do not cache Vite assets aggressively in development
        location /build/assets/ {
            try_files $uri =404;
        }

        # Service Worker header — disable caching
        location = /build/sw.js {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri =404;
        }

        # WebSocket → Reverb (separate service container)
        location ~ ^/(app|apps)/ {
            set $reverb_backend "http://reverb:8080";
            proxy_pass $reverb_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy public media requests to MinIO (resolves mixed content issues locally)
        location ^~ /not-alone/ {
            set $minio_backend "http://minio:9000";
            proxy_pass $minio_backend;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param HTTP_X_FORWARDED_PORT $server_port;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        }
    }
}
